# docker-compose.yml — ClutterKill
# Pornește Ollama local cu modelul llama3.2 pre-descărcat.
#
# Utilizare:
#   docker compose up -d          # pornește Ollama în background
#   docker compose logs -f        # urmărește log-urile
#   docker compose down           # oprește
#
# Prima pornire descarcă modelul llama3.2 (~2 GB) — durează câteva minute.
# Modelul este cached în volumul "ollama_data" și nu se re-descarcă la restart.

services:

  # ─── Serverul Ollama ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: clutterkill-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"          # API Ollama accesibil pe localhost:11434
    volumes:
      - ollama_data:/root/.ollama   # modele persistente între restart-uri
    environment:
      - OLLAMA_HOST=0.0.0.0        # ascultă pe toate interfețele
      - OLLAMA_KEEP_ALIVE=24h      # menține modelul în memorie 24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Init — descarcă modelul o singură dată ───────────────────────────────
  # Acest container rulează o singură dată după ce 'ollama' este healthy,
  # descarcă llama3.2 și se oprește automat.
  ollama-init:
    image: ollama/ollama:latest
    container_name: clutterkill-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: >
      sh -c "
        echo '📦 Descărcând modelul llama3.2...' &&
        ollama pull llama3.2 &&
        echo '✅ Modelul llama3.2 este gata!'
      "
    restart: "no"              # rulează o singură dată
    volumes:
      - ollama_data:/root/.ollama

  # ─── Generare date de test ────────────────────────────────────────────────
  # Rulează mock_generator.py într-un container izolat cu toate dependențele
  # preinstalate (fpdf2, Pillow, faker). Fișierele generate aterizează în
  # tests/mock_data/ pe mașina host prin volume mount.
  #
  # Utilizare:
  #   docker compose run --rm mock-generator
  #
  # Cu parametri personalizați:
  #   docker compose run --rm mock-generator python tools/mock_generator.py --text-pdfs 50
  mock-generator:
    build:
      context: .
      dockerfile: tools/Dockerfile.mock
    container_name: clutterkill-mock-generator
    volumes:
      - ./tools:/app/tools                       # Pentru a rula cea mai nouă versiune a scriptului
      - ./tests/mock_data:/app/tests/mock_data   # output aterizează pe host
    restart: "no"   # rulează o singură dată și se oprește

  # ─── Aplicația ClutterKill (placeholder — activează când PyQt6 e gata) ──
  # app:
  #   build: .
  #   container_name: clutterkill-app
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   environment:
  #     - OLLAMA_BASE_URL=http://ollama:11434
  #     - LLM_MODE=local
  #     - OLLAMA_MODEL_PATH=llama3.2
  #   volumes:
  #     - .:/app
  #   working_dir: /app

# ─── Volume-uri persistente ───────────────────────────────────────────────
volumes:
  ollama_data:
    driver: local
