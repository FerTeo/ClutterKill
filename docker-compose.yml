version: '3.8'

services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
      target: ollama-service
    container_name: clutterkill_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ai:/app/ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-service
    container_name: clutterkill_app
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      # Suprascrie URL-ul din .env cu hostname-ul intern Docker
      - OLLAMA_BASE_URL=http://ollama:11434
    command: tail -f /dev/null

volumes:
  ollama_data:
