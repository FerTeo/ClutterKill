[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent AI demo for students"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-google-genai>=2.0.0",
    # ─── Document parsing și OCR (ai/agents/parsers) ───────────────────────
    "pdfplumber>=0.11.0",    # PDF extraction și parsing
    "python-docx>=1.1.0",    # DOCX file handling
    "pytesseract>=0.3.10",   # OCR engine integration
    "filetype>=1.2.0",       # MIME type detection
    "Pillow>=10.0.0",        # image processing și OCR preprocessing
    # ─── Generare date de test (tools/mock_generator.py) ───────────────────
    "fpdf2>=2.7.0",          # criere PDF-uri text și scan simulate
    "faker>=25.0.0",         # date false realiste în română
    # ─── Testing ────────────────────────────────────────────────────────────
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyqt6>=6.11.0",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.4.4",          # linting + formatare (vezi .ruff.toml)
    "pre-commit>=3.7.0",    # git hooks (vezi .pre-commit-config.yaml)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
